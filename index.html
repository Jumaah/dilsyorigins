<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dilsy Origins | Taking a Sweet Break</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="icon" type="image/png" href="logo.png">
    <meta property="og:title" content="Dilsy Origins | Taking a Sweet Break">
    <meta property="og:image" content="https://dilsyorigins.com/share.jpg">
    <meta property="og:url" content="https://dilsyorigins.com/">
    
    <!-- FontAwesome for Instagram Icon -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #fdf8ee;
        }

        /* أنيميشن الدوران البطيء للحلقة النصية */
        .slow-spin {
            animation: spin 25s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* تأثير ظهور ناعم للصفحة */
        .fade-in {
            animation: fadeIn 1.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-6 text-center relative overflow-hidden">

    <!-- دوائر تزيينية في الخلفية -->
    <div
        class="absolute top-[-10%] left-[-10%] w-64 h-64 bg-[#7fb582] rounded-full mix-blend-multiply filter blur-3xl opacity-20 pointer-events-none">
    </div>
    <div
        class="absolute bottom-[-10%] right-[-10%] w-64 h-64 bg-[#f0a969] rounded-full mix-blend-multiply filter blur-3xl opacity-20 pointer-events-none">
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="max-w-lg w-full flex flex-col items-center gap-10 fade-in relative z-10">

        <!-- اللوغو والحلقة النصية الدوارة -->
        <div class="relative flex items-center justify-center w-72 h-72 md:w-80 md:h-80 mx-auto">

            <!-- الحلقة النصية الدوارة (SVG) -->
            <svg viewBox="0 0 200 200"
                class="absolute inset-0 w-full h-full slow-spin text-[#8c7a61] opacity-70 pointer-events-none">
                <defs>
                    <path id="circlePath" d="M 100, 100 m -85, 0 a 85,85 0 1,1 170,0 a 85,85 0 1,1 -170,0" />
                </defs>
                <text font-size="15" font-weight="600" fill="currentColor" letter-spacing="3.5">
                    <textPath href="#circlePath" startOffset="0%" textLength="530">
                        • DILSY ORIGINS • SWEET BREAK • DILSY ORIGINS • SWEET BREAK
                    </textPath>
                </text>
            </svg>

            <!-- اللوغو الثابت في المنتصف بدون خلفية -->
            <div class="absolute w-44 h-44 md:w-52 md:h-52 flex items-center justify-center p-2">
                <img src="logo.png" alt="Dilsy Origins Logo" class="w-full h-full object-contain drop-shadow-md" />
            </div>

        </div>

        <!-- النصوص -->
        <div class="space-y-4 -mt-2">
            <h1 class="text-3xl md:text-4xl font-bold text-[#4c8455]">We're on a Sweet Break!</h1>

            <p class="text-[#8c7a61] text-lg leading-relaxed px-4">
                We are currently taking a pause.<br />
                If the time feels right, we may return in the future.<br />
                Or perhaps, this is where the chapter quietly closes.
            </p>
        </div>

        <!-- زر الانستغرام -->
        <div>
            <a href="https://www.instagram.com/dilsyorigins/" target="_blank" rel="noopener noreferrer"
                class="group inline-flex items-center gap-3 px-8 py-3.5 rounded-full bg-[#4c8455] text-white hover:bg-[#3d6a44] transition-all duration-300 shadow-[0_8px_20px_rgba(76,132,85,0.25)] hover:-translate-y-1">
                <i class="fab fa-instagram text-2xl transition-transform duration-300 group-hover:scale-110"></i>
                <span class="font-semibold tracking-wide">Follow Us</span>
            </a>
        </div>

    </div>

</body>

</html>
